name: Daily Bilingual News Generator

on:
  schedule:
    # 日本時間 06:30 (UTC 21:30) に毎日実行
    - cron: '30 21 * * *'
  workflow_dispatch: # GitHub画面からいつでも手動テスト実行できるボタン

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run daily news & AI generator
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python scripts/generate_daily.py

      - name: Commit and push generated JSON
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add public/data/
          git commit -m "Update daily bilingual news $(date +'%Y-%m-%d')" || exit 0
          git push
